name: Update versions

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest versions
        run: |
          GCC=$(curl -s https://ftp.gnu.org/gnu/gcc/ \
            | grep -o 'gcc-[0-9]\+\.[0-9]\+\.[0-9]\+/' \
            | sed 's#gcc-##; s#/##' \
            | sort -V | tail -n 1)    
          NODEJS=$(git ls-remote --tags https://github.com/nodejs/node \
            | awk -F/ '!/[\^]|head/ {gsub("v", ""); print $3}' \
            | sort -V | tail -1)

          yq -i ".gcc= \"$GCC\"" versions.yaml
          yq -i ".nodejs= \"$NODEJS\"" versions.yaml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-versions
          delete-branch: true
          title: Update versions
          commit-message: Update versions